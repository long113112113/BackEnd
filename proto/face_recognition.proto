syntax = "proto3";

package facerecognition;

service FaceRecognition {
  // Verify a captured face image against the student's reference embedding.
  // Returns match/mismatch plus a liveness score for anti-spoofing.
  rpc Recognize(RecognizeRequest) returns (RecognizeResponse);

  // Bi-directional streaming for the AI Edge Worker pattern
  rpc ConnectWorker(stream WorkerMessage) returns (stream ServerMessage);
}

message Ping {
  int64 timestamp = 1;
}

message WorkerMessage {
  oneof payload {
    WorkerRegistration register = 1;
    RecognizeResponse result = 2;
    Ping pong = 3;
    ExtractFeatureResponse extract_result = 4;
  }
}

message WorkerRegistration {
  string worker_id = 1;
}

message ServerMessage {
  oneof payload {
    RecognizeRequest task = 1;
    Ping ping = 2;
    ExtractFeatureRequest extract_task = 3;
  }
}

message FaceBox {
  int32 x = 1;
  int32 y = 2;
  int32 w = 3;
  int32 h = 4;
  float score = 5;
}

message FaceEmbedding {
  repeated float vector = 1;
}

message RecognizeRequest {
  int32    face_capture_id = 1;
  int32    attendance_id   = 2;
  int32    student_id_hint = 3;
  bytes    image           = 4;  // raw JPEG
  FaceBox  box             = 5;
  int64    ts_ms           = 6;  // server clock at trigger
  repeated FaceEmbedding reference_embeddings = 7;
}

message ExtractFeatureRequest {
  int32  student_id_hint = 1;
  bytes  image           = 2;  // raw JPEG
  FaceBox box            = 3;
  string request_id      = 4;  // correlation id
}

message ExtractFeatureResponse {
  bool   success         = 1;
  string request_id      = 2;
  repeated float embedding = 3;  // face embedding vector (e.g. 512-d)
  float  quality_score   = 4;    // image quality 0..1
  string error           = 5;    // error message if !success
}

message RecognizeResponse {
  bool    matched         = 1;
  int32   student_id      = 2;  // 0 if no match
  float   score           = 3;  // cosine similarity 0..1
  float   liveness_score  = 4;  // 0..1, higher = more likely live
  string  decision        = 5;  // match | mismatch | spoof | no_face | error
  string  request_id      = 6;  // AI-side correlation id
}
